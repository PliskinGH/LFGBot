<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LFG Bot Panel{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
<link rel="stylesheet" href="{{ url_for('static', path='panel.css') }}">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}">LFG Bot</a>
    {% if user %}
    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link {% if active == 'home' %}active{% endif %}"
           href="{{ url_for('home') }}">Servers</a>
      </li>
      {% if operator %}
      <li class="nav-item">
        <a class="nav-link {% if active.startswith('ops') %}active{% endif %}"
           href="{{ url_for('ops') }}">Operations</a>
      </li>
      {% endif %}
    </ul>
    <span class="navbar-text me-3">{{ user.name }}</span>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn btn-sm btn-outline-light" type="submit">Log out</button>
    </form>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% for level, message in flashes %}
  <div class="alert alert-{{ 'danger' if level == 'error' else level }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
