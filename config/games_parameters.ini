# Per-game optional slash command parameters.
#
# Each section name must match a game command from `GamesCommands` in
# config/games.ini
# Each key is a parameter of that game's slash command. Its value is the
# match API field name followed by a colon, then the acceptable values:
#   - a comma-separated list of acceptable values, or
#   - a list of (value, Display Name) pairs, where the value is the raw value
#     accepted by the match API and the display name is what users see:
#         setup = game_setup: (adset, Advanced), (standard, Standard)
#   No quotes are needed: parentheses delimit each pair and the first comma
#   inside them separates the value from the display name (display names may
#   contain parentheses and commas).
# A parameter without a field prefix is only surfaced in Discord and is not
# sent to the match API.
#
# The fixed match payload components — the title, the thread link, and the
# participants list — are declared by reserved keys (prefix "api_") in the
# [DEFAULT] section, so every game section inherits them. They are not
# parameters. A game can override them in its own section:
#   api_title_field = title
#   api_table_talk_url_field = table_talk_url
#   api_participants_field = participants
#   api_discord_username_field = discord_username
#
# Whether a field accepts several values is read from the match API metadata
# (OPTIONS request), not declared here.
# Long lists may be wrapped over several lines: each continuation line just
# needs to be indented.
# Display names are what users see (autocomplete, Settings field, help);
# raw values are what gets submitted.
#
# All parameters are optional. Provide several values (comma-separated) at
# invocation time to pick multiple options, e.g.:
#   /rdl map:autumn,winter deck:standard
#
# Parameters are only available as slash command arguments (direct mode),
# not in the guided modal: Discord caps modals at 5 components.

[DEFAULT]
api_title_field = title
api_table_talk_url_field = table_talk_url
api_participants_field = participants
api_discord_username_field = discord_username

[rdl]
turn_timing = turn_timing: (live, Live), (async, Async)
deck = deck: (standard, Standard), (e&p, Exiles and Partisans)
map = board_map: (autumn, Autumn), (winter, Winter), (mountain, Mountain), (lake, Lake)
suits = random_suits: (false, Fixed), (true, Random)
landmarks = landmarks: (lm_bm, Black Market), (lm_et, Elder Treetop), (lm_ferry, The Ferry), (lm_lf, Legendary Forge), (lm_lc, Lost City), (lm_tower, The Tower)

[test]
