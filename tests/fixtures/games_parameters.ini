# Fixture mirroring config/games_parameters.ini: per-game optional slash
# command parameters used by the test suite.
#
# Each section name must match a game command from the games config used by
# the test (tests/fixtures/games.ini or an inline config). Each key is a
# parameter of that game's slash command; its value is the match API field
# name followed by a colon, then either a comma-separated list of acceptable
# values (param3) or a list of (value, Display Name) pairs (param1, param2).
# param3 has no field prefix: it is only surfaced in Discord, not sent to the
# match API.
# The reserved api_* keys declare the match API field names for the fixed
# payload components. They use deliberately non-obvious names so the tests
# prove the bot reads them from the config rather than hardcoding them.
#
# Parameters are only available as slash command arguments (direct mode),
# not in the guided modal: Discord caps modals at 5 components.

[game_a]
api_title_field = match_title
api_table_talk_url_field = discussion_url
api_participants_field = players
api_discord_username_field = discord_name
param1 = field_one: (alpha, Alpha One), (beta, Beta Two), (gamma, Gamma Three), (delta, Delta Four)
param2 = field_two: (first, First Choice), (second, Second Choice)
param3 = yes, no