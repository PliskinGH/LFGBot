# Fixture mirroring config/games_parameters.ini: per-game optional slash
# command parameters used by the test suite.
#
# Each section name must match a game command from the games config used by
# the test (tests/fixtures/games.ini or an inline config). Each key is a
# parameter of that game's slash command; its value is either a
# comma-separated list of acceptable values (param3) or a list of
# (value, Display Name) pairs (param1, param2).
#
# Parameters are only available as slash command arguments (direct mode),
# not in the guided modal: Discord caps modals at 5 components.

[game_a]
param1 = (alpha, Alpha One), (beta, Beta Two), (gamma, Gamma Three), (delta, Delta Four)
param2 = (first, First Choice), (second, Second Choice)
param3 = yes, no