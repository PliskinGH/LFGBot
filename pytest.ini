[pytest]
# Treat plain `async def` test/`fixture` functions as asyncio tests automatically.
asyncio_mode = auto
# Make the project root importable (so `common`, `cogs` resolve from tests).
pythonpath = .
# Discover test files under the tests/ folder.
testpaths = tests
# The web tests drive the panel with starlette's TestClient, which runs the app
# on an event loop of its own: Tortoise reconnects and says so on each query.
filterwarnings =
    ignore::tortoise.warnings.TortoiseLoopSwitchWarning